name: ObjectifsFit
options:
  bundleIdPrefix: com.papiyaso93
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "ZQRDF4F5V8"
    CODE_SIGN_STYLE: Automatic
targets:
  ObjectifsFit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ObjectifsFit
    info:
      path: ObjectifsFit/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: "Genki"
        NSHealthShareUsageDescription: "Genki lit ton poids, ta masse grasse et ta VO2max depuis Santé pour suivre ta progression sans ressaisie."
        NSHealthUpdateUsageDescription: "Genki peut écrire tes métriques saisies manuellement dans Santé."
    entitlements:
      path: ObjectifsFit/ObjectifsFit.entitlements
      properties:
        com.apple.developer.healthkit: true
    capabilities:
      - HealthKit
    bundleIdPrefix: com.papiyaso93
